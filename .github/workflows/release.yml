name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15
          - target: aarch64-apple-darwin
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../dmgr-${{ github.ref_name }}-${{ matrix.target }}.tar.gz dmgr
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmgr-${{ matrix.target }}
          path: dmgr-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          generate_release_notes: true

      - name: Update Homebrew Formula
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA_ARM64=$(shasum -a 256 artifacts/dmgr-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz | cut -d ' ' -f 1)
          SHA_X86=$(shasum -a 256 artifacts/dmgr-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz | cut -d ' ' -f 1)

          sed -i "s/version \".*\"/version \"$VERSION\"/" Formula/dmgr.rb
          sed -i "s/REPLACE_ARM64_SHA256/$SHA_ARM64/" Formula/dmgr.rb
          sed -i "s/REPLACE_X86_64_SHA256/$SHA_X86/" Formula/dmgr.rb
          # Also update existing sha256 values on subsequent releases
          sed -i "s/sha256 \"[a-f0-9]\{64\}\" # arm64/sha256 \"$SHA_ARM64\" # arm64/" Formula/dmgr.rb
          sed -i "s/sha256 \"[a-f0-9]\{64\}\" # x86_64/sha256 \"$SHA_X86\" # x86_64/" Formula/dmgr.rb

      - name: Commit Formula update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/dmgr.rb
          git commit -m "Update Homebrew formula for ${{ github.ref_name }}" || exit 0
          git push origin HEAD:main
